<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кітаптар каталогы — BookNest</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="books">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">BookNest</a>
      <nav class="nav-menu" aria-label="Негізгі навигация">
        <ul class="nav-list">
          <li><a href="index.html">Басты бет</a></li>
          <li><a href="books.html" class="active" aria-current="page">Каталог</a></li>
          <li><a href="club.html">Оқу клубы</a></li>
          <li><a href="contact.html">Байланыс</a></li>
          <li><a href="admin.html">Админ</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="btn-outline" data-open-cart>Себет (<strong data-cart-count>0</strong>)</button>
        <button type="button" class="theme-toggle" aria-label="Қараңғы тақырып">🌙</button>
      </div>
    </div>
  </header>

  <main class="container section">
    <h1 class="section-title">Кітаптар каталогы</h1>

    <div class="catalog-controls" style="display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem;">
      <input type="search" id="search-input" placeholder="Кітап немесе автор іздеу...">
      <select id="sort-select" aria-label="Сұрыптау">
        <option value="default">Әдепкі бойынша</option>
        <option value="price-asc">Арзаннан қымбатқа</option>
        <option value="price-desc">Қымбаттан арзанға</option>
        <option value="rating-desc">Рейтинг бойынша</option>
      </select>
    </div>

    <div id="genre-chips" class="chips-row" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;"></div>

    <div class="card-actions" style="margin-bottom:1rem;">
      <button type="button" id="wishlist-filter-btn" class="btn-outline">Тек таңдаулылар (<span data-wish-count>0</span>)</button>
      <button type="button" id="clear-cart-btn" class="btn-outline">Себетті тазарту</button>
      <button type="button" id="reset-filters-btn" class="btn-outline">Деректерді ысыру</button>
      <button type="button" id="run-self-checks-btn" class="btn-outline">Автотест</button>
    </div>

    <div id="drop-to-cart-zone" class="checkout-box" style="margin-bottom:1rem; text-align:center;">
      Кітап карточкасын осы жерге сүйреп апарыңыз (Себетке)
    </div>

    <p id="results-count" class="muted"></p>
    <div id="catalog-status" class="muted"></div>

    <div id="books-grid" class="books-grid"></div>
    <div id="empty-state" class="checkout-box" hidden>
      <p>Кітаптар табылмады.</p>
    </div>
    <div id="load-more-sentinel"></div>
  </main>

  <div id="book-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true">
    <div class="modal-panel">
      <button type="button" class="modal-close" aria-label="Жабу">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <aside id="cart-drawer" class="drawer-backdrop" hidden role="dialog" aria-modal="true" aria-label="Себет">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h2>Себет</h2>
        <button type="button" class="drawer-close" aria-label="Жабу">&times;</button>
      </div>

      <div id="cart-drawer-items" class="drawer-items"></div>
      <div id="cart-drawer-summary" class="drawer-summary"></div>

      <form id="promo-form" class="form-group" style="margin-top: 1rem;">
        <label for="promo-input">Промокод (BOOK10 / BOOK20)</label>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="promo-input" placeholder="BOOK10">
          <button type="submit" class="btn-outline">Қолдану</button>
        </div>
        <p id="promo-message" class="muted" style="margin-top: 0.35rem;"></p>
      </form>

      <div class="checkout-box" style="margin-top: 1rem;">
        <p id="checkout-progress" class="muted">Қадам 1 / 3</p>
        <p id="checkout-error" style="color: var(--color-error, #ef4444);"></p>

        <div data-step-panel="1">
          <div class="form-group">
            <label for="order-phone">Телефон</label>
            <input type="tel" id="order-phone" placeholder="+7 777 123 45 67">
          </div>
          <div class="form-group">
            <label for="order-address">Мекенжай</label>
            <input type="text" id="order-address" placeholder="Ақтау, 14 мкр">
          </div>
          <button type="button" id="step1-next" class="btn">Келесі</button>
        </div>

        <div data-step-panel="2" hidden>
          <div class="form-group">
            <label for="order-card">Карта (тест: 4532015112830366)</label>
            <input type="text" id="order-card" placeholder="4532015112830366">
          </div>
          <div class="card-actions">
            <button type="button" id="step2-back" class="btn-outline">Артқа</button>
            <button type="button" id="step2-next" class="btn">Келесі</button>
          </div>
        </div>

        <div data-step-panel="3" hidden>
          <p id="confirm-summary" style="margin-bottom: 0.75rem;"></p>
          <div class="card-actions">
            <button type="button" id="step3-back" class="btn-outline">Артқа</button>
            <button type="button" id="step3-submit" class="btn">Тапсырыс беру</button>
          </div>
        </div>
      </div>

      <div style="margin-top: 1.25rem;">
        <h3>Тапсырыстар тарихы</h3>
        <div id="orders-history"></div>
      </div>
    </div>
  </aside>

  <button type="button" id="back-to-top" class="back-to-top" aria-label="Жоғарыға көтерілу">↑</button>
</body>
</html>
